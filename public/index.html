<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Stacey & Ash</title>
    <style>
        * { box-sizing: border-box; }
        
        :root {
            --bg-color: #0d0d0d;
            --header-color: #ff2a2a;
            --bubble-right-bg: #222222;
            --bubble-right-text: #ffffff;
            --bubble-right-border: #333333;
            --bubble-left-bg: #3a080a;
            --bubble-left-text: #ffb3b3;
            --bubble-left-border: #6b1115;
            --btn-bg: #6b0c10;
            --btn-border: #8f1318;
            --input-border: #5a0f13;
            --scrollbar-thumb: #6b0c10;
        }

        body.cyber {
            --bg-color: #050515;
            --header-color: #00f0ff;
            --bubble-right-bg: #101530;
            --bubble-right-text: #ffffff;
            --bubble-right-border: #1f295d;
            --bubble-left-bg: #2d0036;
            --bubble-left-text: #ff007f;
            --bubble-left-border: #7b0080;
            --btn-bg: #00f0ff;
            --btn-border: #00a8ff;
            --input-border: #00f0ff;
            --scrollbar-thumb: #00f0ff;
        }

        body.emerald {
            --bg-color: #06140e;
            --header-color: #10b981;
            --bubble-right-bg: #11261d;
            --bubble-right-text: #ffffff;
            --bubble-right-border: #1e3e30;
            --bubble-left-bg: #062c1b;
            --bubble-left-text: #a7f3d0;
            --bubble-left-border: #047857;
            --btn-bg: #059669;
            --btn-border: #10b981;
            --input-border: #059669;
            --scrollbar-thumb: #10b981;
        }

        body { 
            font-family: sans-serif; 
            background: var(--bg-color); 
            color: #ffffff; 
            margin: 0; 
            padding: 12px; 
            transition: all 0.3s ease;
            width: 100%;
        }

        .app-container {
            width: 100%;
            margin: 0 auto;
        }
        
        #chatbox::-webkit-scrollbar, body::-webkit-scrollbar { width: 6px; }
        #chatbox::-webkit-scrollbar-track, body::-webkit-scrollbar-track { background: var(--bg-color); }
        #chatbox::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }

        .header { text-align: center; font-weight: bold; padding: 0 0 12px 0; font-size: 20px; color: var(--header-color); }

        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
            width: 100%;
        }

        select#themeSelect, select#username {
            font-size: 13px; 
            padding: 6px 12px; 
            border: 1px solid #333;
            border-radius: 6px; 
            background: #161616; 
            color: #fff; 
            outline: none; 
            cursor: pointer;
            min-width: 120px;
        }

        #chatbox { 
            height: 60vh; 
            background: var(--bg-color); 
            overflow-y: scroll; 
            padding: 15px; 
            margin-bottom: 12px; 
            border: 1px solid #222; 
            border-radius: 10px; 
            width: 100%;
        }
        
        .msg-line { margin-bottom: 14px; clear: both; position: relative; }
        .msg-right { text-align: right; }
        .msg-right .sender-name { font-size: 11px; color: #a1a1a1; margin-bottom: 3px; font-weight: bold; }
        .msg-right .bubble { display: inline-block; padding: 10px 14px; border-radius: 12px; font-size: 14px; background: var(--bubble-right-bg); color: var(--bubble-right-text); border: 1px solid var(--bubble-right-border); max-width: 75%; white-space: pre-wrap; word-wrap: break-word; text-align: right; }
        
        .msg-left { text-align: left; }
        .msg-left .sender-name { font-size: 11px; color: #a1a1a1; margin-bottom: 3px; font-weight: bold; }
        .msg-left .bubble { display: inline-block; padding: 10px 14px; border-radius: 12px; font-size: 14px; background: var(--bubble-left-bg); color: var(--bubble-left-text); border: 1px solid var(--bubble-left-border); max-width: 75%; white-space: pre-wrap; word-wrap: break-word; text-align: left; }

        .reply-quote { background: rgba(0,0,0,0.3); border-left: 3px solid var(--header-color); padding: 4px 8px; margin-bottom: 6px; font-size: 12px; border-radius: 4px; color: #ccc; text-align: left; }
        
        .chat-file-img { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 6px; display: block; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
        .chat-file-link { display: inline-block; background: rgba(255,255,255,0.1); padding: 6px 10px; border-radius: 6px; color: #64b5f6; text-decoration: none; font-size: 13px; margin-top: 6px; word-break: break-all; }

        .reactions-wrapper { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
        .msg-right .reactions-wrapper { justify-content: flex-end; }
        .react-btn { background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 12px; padding: 2px 6px; font-size: 11px; cursor: pointer; }
        .react-add { color: #aaa; }
        .react-picker { display: none; background: #1a1a1a; border: 1px solid #333; border-radius: 20px; padding: 4px 8px; gap: 8px; margin-top: 4px; width: fit-content; }
        .msg-right .react-picker { margin-left: auto; }
        .react-picker span { cursor: pointer; font-size: 16px; transition: transform 0.1s; }
        .react-picker span:hover { transform: scale(1.2); }

        #reply-preview, #attachment-preview { display: none; background: #161616; border-left: 3px solid var(--header-color); padding: 6px 10px; margin-bottom: 6px; font-size: 12px; border-radius: 4px; color: #aaa; }
        .cancel-btn { float: right; cursor: pointer; color: #ff3b30; font-weight: bold; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; text-align: center; }
        .modal-content { position: relative; top: 38%; background: #1c1c1e; border: 1px solid #333; width: 80%; max-width: 280px; margin: 0 auto; border-radius: 12px; overflow: hidden; }
        .modal-btn { display: block; width: 100%; padding: 13px; background: none; border: none; color: #fff; font-size: 15px; border-bottom: 1px solid #2c2c2e; cursor: pointer; text-align: center; }
        .modal-btn.delete { color: #ff3b30; font-weight: bold; }
        .modal-btn.cancel { color: #0a84ff; border-bottom: none; }

        .controls { background: var(--bg-color); width: 100%; }
        .input-row { display: flex; gap: 8px; align-items: center; width: 100%; }
        textarea { flex: 1; height: 44px; font-size: 14px; padding: 10px; border: 1px solid var(--input-border); border-radius: 8px; background: #111111; color: #fff; resize: none; font-family: sans-serif; }
        .attach-btn { width: 44px; height: 44px; background: #1c1c1e; color: #fff; border: 1px solid #333; border-radius: 8px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        button.send-btn { width: 75px; height: 44px; font-size: 14px; background: var(--btn-bg); color: #fff; border: 1px solid var(--btn-border); border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">✨ Stacey & Ash Corner ✨</div>

        <div class="top-bar">
            <select id="username" onchange="getMessages()">
                <option value="ash" selected>Ash</option>
                <option value="stacey">Stacey</option>
            </select>
            
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="gothic">🔴 Gothic Dark</option>
                <option value="cyber">🔵 Cyberpunk</option>
                <option value="emerald">🟢 Emerald</option>
            </select>
        </div>

        <div id="chatbox"></div>

        <div class="controls">
            <div id="reply-preview">
                Replying to <b id="reply-user"></b>: <span id="reply-text-preview"></span>
                <span class="cancel-btn" onclick="cancelReply()">✕</span>
            </div>

            <div id="attachment-preview">
                📎 Attached: <b id="attach-name"></b>
                <span class="cancel-btn" onclick="cancelAttachment()">✕</span>
            </div>

            <div class="input-row">
                <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect(event)">
                <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <textarea id="messageInput" placeholder="Type a message..." onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <div id="msgModal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-btn" onclick="actionReply()">↩️ Reply</button>
            <button class="modal-btn" onclick="actionCopy()">📋 Copy Text</button>
            <button class="modal-btn delete" onclick="actionDelete()">🗑️ Delete</button>
            <button class="modal-btn cancel" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        var lastMessageCount = 0;
        var selectedMsg = null;
        var activeReplyTo = null;
        var pendingFile = null;
        var isModalOpen = false;
        var activePickerMsgId = null;
        var pickerTimeout = null;

        function changeTheme(theme) {
            document.body.className = '';
            if (theme !== 'gothic') {
                document.body.classList.add(theme);
            }
        }

        function togglePicker(msgId) {
            if (activePickerMsgId === msgId) {
                activePickerMsgId = null;
                if (pickerTimeout) clearTimeout(pickerTimeout);
            } else {
                activePickerMsgId = msgId;
                if (pickerTimeout) clearTimeout(pickerTimeout);
                
                pickerTimeout = setTimeout(function() {
                    activePickerMsgId = null;
                    var picker = document.getElementById('picker-' + msgId);
                    if (picker) picker.style.display = 'none';
                }, 5000);
            }
            
            var picker = document.getElementById('picker-' + msgId);
            if (picker) {
                picker.style.display = (activePickerMsgId === msgId) ? 'flex' : 'none';
            }
        }

        function addReaction(msgId, emoji) {
            activePickerMsgId = null;
            if (pickerTimeout) clearTimeout(pickerTimeout);
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/react?id=' + msgId + '&emoji=' + encodeURIComponent(emoji), true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) getMessages();
            };
            xhr.send();
        }

        function getMessages() {
            if (isModalOpen) return;

            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/messages', true);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    var chatbox = document.getElementById('chatbox');
                    var currentUser = document.getElementById('username').value.trim().toLowerCase();
                    var html = '';
                    
                    for (var i = 0; i < data.length; i++) {
                        var msg = data[i];
                        var isMe = (msg.sender.trim().toLowerCase() === currentUser);
                        var alignClass = isMe ? 'msg-right' : 'msg-left';

                        var replyHtml = '';
                        if (msg.replyTo) {
                            replyHtml = '<div class="reply-quote"><b>' + msg.replyTo.sender + '</b>: ' + msg.replyTo.text + '</div>';
                        }

                        var fileHtml = '';
                        if (msg.file && msg.file.url) {
                            if (msg.file.type === 'image') {
                                fileHtml = '<br><img src="' + msg.file.url + '" class="chat-file-img" onclick="window.open(this.src)" />';
                            } else {
                                fileHtml = '<br><a href="' + msg.file.url + '" download="' + (msg.file.originalName || 'file') + '" class="chat-file-link">📁 ' + (msg.file.originalName || 'Download File') + '</a>';
                            }
                        }

                        var reactionsHtml = '<div class="reactions-wrapper">';
                        if (msg.reactions) {
                            for (var emoji in msg.reactions) {
                                reactionsHtml += '<button class="react-btn">' + emoji + ' ' + msg.reactions[emoji] + '</button>';
                            }
                        }
                        reactionsHtml += '<button class="react-btn react-add" onclick="togglePicker(\'' + msg.id + '\')">+❤️</button></div>';

                        var isPickerOpen = (activePickerMsgId === msg.id);
                        var pickerStyle = isPickerOpen ? 'style="display: flex;"' : 'style="display: none;"';

                        var pickerHtml = '<div id="picker-' + msg.id + '" class="react-picker" ' + pickerStyle + '>' +
                            '<span onclick="addReaction(\'' + msg.id + '\', \'❤️\')">❤️</span>' +
                            '<span onclick="addReaction(\'' + msg.id + '\', \'😂\')">😂</span>' +
                            '<span onclick="addReaction(\'' + msg.id + '\', \'😮\')">😮</span>' +
                            '<span onclick="addReaction(\'' + msg.id + '\', \'🔥\')">🔥</span>' +
                            '<span onclick="addReaction(\'' + msg.id + '\', \'👍\')">👍</span>' +
                        '</div>';

                        html += '<div class="msg-line ' + alignClass + '" id="msg-' + msg.id + '">' +
                                '<div class="sender-name">' + msg.sender + '</div>' +
                                '<div class="bubble" ' +
                                    'ontouchstart="startHold(event, \'' + msg.id + '\', \'' + encodeURIComponent(msg.sender) + '\', \'' + encodeURIComponent(msg.text || '') + '\')" ' +
                                    'ontouchend="cancelHold()" ' +
                                    'oncontextmenu="rightClickMenu(event, \'' + msg.id + '\', \'' + encodeURIComponent(msg.sender) + '\', \'' + encodeURIComponent(msg.text || '') + '\')">' +
                                    replyHtml + (msg.text ? msg.text : '') + fileHtml +
                                '</div>' +
                                reactionsHtml + pickerHtml +
                                '</div>';
                    }

                    chatbox.innerHTML = html;

                    if (data.length > lastMessageCount) {
                        chatbox.scrollTop = chatbox.scrollHeight;
                        lastMessageCount = data.length;
                    }
                }
            };
            xhr.send();
        }

        function handleFileSelect(e) {
            var file = e.target.files[0];
            if (!file) return;

            if (file.size > 4.5 * 1024 * 1024) {
                alert('File size exceeds 4.5MB limit for serverless functions.');
                return;
            }

            var formData = new FormData();
            formData.append('file', file);

            document.getElementById('attach-name').innerText = 'Uploading...';
            document.getElementById('attachment-preview').style.display = 'block';

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/upload', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        var res = JSON.parse(xhr.responseText);
                        pendingFile = res;
                        document.getElementById('attach-name').innerText = file.name;
                    } else {
                        alert('Failed to upload file.');
                        cancelAttachment();
                    }
                }
            };
            xhr.send(formData);
        }

        function cancelAttachment() {
            pendingFile = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('attachment-preview').style.display = 'none';
        }

        var holdTimer = null;
        function startHold(e, id, sender, text) {
            holdTimer = setTimeout(function() {
                openModal(id, decodeURIComponent(sender), decodeURIComponent(text));
            }, 500);
        }
        function cancelHold() {
            if (holdTimer) clearTimeout(holdTimer);
        }

        function rightClickMenu(e, id, sender, text) {
            e.preventDefault();
            openModal(id, decodeURIComponent(sender), decodeURIComponent(text));
        }

        function openModal(id, sender, text) {
            selectedMsg = { id: id, sender: sender, text: text };
            isModalOpen = true;
            document.getElementById('msgModal').style.display = 'block';
        }

        function closeModal() {
            selectedMsg = null;
            isModalOpen = false;
            document.getElementById('msgModal').style.display = 'none';
        }

        function actionReply() {
            if (!selectedMsg) return;
            activeReplyTo = { sender: selectedMsg.sender, text: selectedMsg.text };
            document.getElementById('reply-user').innerText = selectedMsg.sender;
            document.getElementById('reply-text-preview').innerText = selectedMsg.text;
            document.getElementById('reply-preview').style.display = 'block';
            closeModal();
            document.getElementById('messageInput').focus();
        }

        function cancelReply() {
            activeReplyTo = null;
            document.getElementById('reply-preview').style.display = 'none';
        }

        function actionCopy() {
            if (!selectedMsg) return;
            navigator.clipboard.writeText(selectedMsg.text).then(function() {
                alert('Copied to clipboard!');
            });
            closeModal();
        }

        function actionDelete() {
            if (!selectedMsg) return;
            var id = selectedMsg.id;
            closeModal();
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/delete?id=' + id, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) getMessages();
            };
            xhr.send();
        }

        function sendMessage() {
            var user = document.getElementById('username').value || 'ash';
            var input = document.getElementById('messageInput');
            var text = input.value;
            
            if (!text.replace(/\s/g, '') && !pendingFile) return;

            var payload = { 
                sender: user, 
                text: text, 
                replyTo: activeReplyTo,
                file: pendingFile
            };

            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/messages', true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    cancelReply();
                    cancelAttachment();
                    getMessages();
                }
            };
            xhr.send(JSON.stringify(payload));
            input.value = '';
        }

        function handleKeyDown(e) {
            var keyCode = e.keyCode || e.which;
            if (keyCode === 13 && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        setInterval(getMessages, 1000);
    </script>
</body>
</html>
