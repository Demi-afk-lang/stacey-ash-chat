<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacey & Ash Corner</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --main-red: #ff3333;
            --msg-sent: #8b0000;
            --msg-rec: #1a1a1a;
            --text-color: #ffffff;
            --action-color: #ff9999;
            --border-color: #333333;
        }

        body.theme-cyber {
            --bg-color: #050b14;
            --main-red: #00f0ff;
            --msg-sent: #005f73;
            --msg-rec: #0a192f;
            --text-color: #e0f7fa;
            --action-color: #70e000;
            --border-color: #005f73;
        }

        body.theme-emerald {
            --bg-color: #06140e;
            --main-red: #2ec4b6;
            --msg-sent: #1b4332;
            --msg-rec: #0d2818;
            --text-color: #e8f5e9;
            --action-color: #b7e4c7;
            --border-color: #2ec4b6;
        }

        body { background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; margin: 0; padding: 10px; transition: 0.3s; }
        .header { text-align: center; font-weight: bold; color: var(--main-red); margin-bottom: 8px; font-size: 18px; }
        
        .controls-bar { display: flex; justify-content: space-between; gap: 5px; margin-bottom: 8px; }
        select, button, input { background: var(--msg-rec); color: var(--text-color); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 6px; font-size: 13px; }

        #chat-box { height: 60vh; overflow-y: auto; border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.2); }
        
        .msg { margin-bottom: 12px; padding: 8px 12px; border-radius: 8px; max-width: 80%; clear: both; word-wrap: break-word; font-size: 14px; position: relative; }
        .sent { background-color: var(--msg-sent); float: right; text-align: right; }
        .received { background-color: var(--msg-rec); float: left; text-align: left; }
        
        .sender-name { font-size: 11px; font-weight: bold; margin-bottom: 3px; color: var(--main-red); opacity: 0.9; }
        .action-text { font-style: italic; color: var(--action-color); font-weight: 500; }
        
        /* Reactions UI */
        .reactions-wrapper { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
        .react-btn { background: rgba(255,255,255,0.08); border: none; padding: 2px 6px; font-size: 11px; border-radius: 10px; cursor: pointer; color: var(--text-color); }
        .react-add { opacity: 0.5; }
        .react-picker { display: none; margin-top: 4px; background: #222; padding: 4px; border-radius: 6px; position: absolute; z-index: 10; }
        
        .input-area { margin-top: 8px; display: flex; gap: 5px; }
        input[type="text"] { flex-grow: 1; }
        .send-btn { background: var(--main-red); color: #000; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">✨ Stacey & Ash Corner ✨</div>

    <div class="controls-bar">
        <select id="userSelect">
            <option value="ash">Ash</option>
            <option value="stacey">Stacey</option>
            <option value="narrator">الراوي (Narrator)</option>
        </select>

        <select id="themeSelect" onchange="changeTheme(this.value)">
            <option value="gothic">🔴 Gothic Dark</option>
            <option value="cyber">🔵 Cyberpunk</option>
            <option value="emerald">🟢 Emerald</option>
        </select>

        <button onclick="clearChat()" style="color: #ff5555;">🗑️ مسح</button>
    </div>

    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="اكتب رسالة... استخدم *الفعل* للـ Roleplay" onkeypress="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        let lastMsgId = '';

        function changeTheme(theme) {
            document.body.className = '';
            if (theme !== 'gothic') document.body.classList.add('theme-' + theme);
        }

        // تنسيق الأكشن بين النجمات *text*
        function formatRoleplayText(text) {
            if (!text) return '';
            return text.replace(/\*(.*?)\*/g, '<span class="action-text">*$1*</span>');
        }

        function fetchMessages() {
            const currentUser = document.getElementById('userSelect').value;
            fetch('/api/messages')
                .then(res => res.json())
                .then(data => {
                    const chatBox = document.getElementById('chat-box');
                    chatBox.innerHTML = '';

                    data.forEach(msg => {
                        const isMe = msg.sender === currentUser;
                        const div = document.createElement('div');
                        div.className = `msg ${isMe ? 'sent' : 'received'}`;
                        
                        let html = `<div class="sender-name">${msg.sender}</div>`;
                        html += `<div>${formatRoleplayText(msg.text)}</div>`;
                        if (msg.file) html += `<img src="${msg.file}" style="max-width:100%; border-radius:5px; margin-top:5px;">`;

                        // أزرار الرياكت
                        html += `<div class="reactions-wrapper">`;
                        for (let emoji in msg.reactions) {
                            html += `<button class="react-btn">${emoji} ${msg.reactions[emoji]}</button>`;
                        }
                        html += `<button class="react-btn react-add" onclick="togglePicker('${msg.id}')">+❤️</button>`;
                        html += `</div>`;

                        html += `<div id="picker-${msg.id}" class="react-picker">
                            <span onclick="addReaction('${msg.id}', '❤️')">❤️</span>
                            <span onclick="addReaction('${msg.id}', '😂')">😂</span>
                            <span onclick="addReaction('${msg.id}', '😮')">😮</span>
                            <span onclick="addReaction('${msg.id}', '🔥')">🔥</span>
                            <span onclick="addReaction('${msg.id}', '👍')">👍</span>
                        </div>`;

                        div.innerHTML = html;
                        chatBox.appendChild(div);
                    });

                    if (data.length > 0 && data[data.length - 1].id !== lastMsgId) {
                        chatBox.scrollTop = chatBox.scrollHeight;
                        lastMsgId = data[data.length - 1].id;
                    }
                });
        }

        function togglePicker(msgId) {
            const el = document.getElementById(`picker-${msgId}`);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function addReaction(msgId, emoji) {
            fetch('/api/reactions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ msgId, emoji })
            }).then(() => fetchMessages());
        }

        function sendMessage() {
            const currentUser = document.getElementById('userSelect').value;
            const input = document.getElementById('msgInput');
            if (!input.value.trim()) return;

            const formData = new FormData();
            formData.append('sender', currentUser);
            formData.append('text', input.value);

            fetch('/api/messages', { method: 'POST', body: formData })
                .then(() => {
                    input.value = '';
                    fetchMessages();
                });
        }

        function clearChat() {
            if (confirm('هل تريد مسح جميع الرسائل؟')) {
                fetch('/api/messages', { method: 'DELETE' }).then(() => fetchMessages());
            }
        }

        setInterval(fetchMessages, 2000);
        fetchMessages();
    </script>
</body>
</html>
